<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>DISSIPL - Changer le mot de passe</title>
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    />
  <script>window.DISSIPL_PREVIEW = true;</script>
</head>
  <body class="bg-light">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card shadow-sm">
            <div class="card-header bg-warning">
              <h5 class="mb-0">🔑 Définir un nouveau mot de passe</h5>
            </div>
            <div class="card-body">
              <p class="mb-3">
                Votre compte a été créé par votre directeur. Pour continuer,
                vous devez choisir un <strong>mot de passe définitif</strong>.
              </p>

              <div
                id="changePwdError"
                class="alert alert-danger"
                style="display: none"
              ></div>
              <div
                id="changePwdSuccess"
                class="alert alert-success"
                style="display: none"
              ></div>

              <form id="changePwdForm">
                <div class="form-group">
                  <label for="currentPassword">Mot de passe provisoire</label>
                  <input
                    type="password"
                    class="form-control"
                    id="currentPassword"
                    required
                  />
                </div>
                <div class="form-group">
                  <label for="newPassword">Nouveau mot de passe</label>
                  <input
                    type="password"
                    class="form-control"
                    id="newPassword"
                    required
                    minlength="8"
                  />
                  <small class="form-text text-muted">
                    8 caractères mini, 1 majuscule, 1 chiffre.
                  </small>
                </div>
                <div class="form-group">
                  <label for="confirmPassword">Confirmer le mot de passe</label>
                  <input
                    type="password"
                    class="form-control"
                    id="confirmPassword"
                    required
                  />
                </div>
                <button type="submit" class="btn btn-primary btn-block">
                  ✅ Valider
                </button>
              </form>
            </div>
          </div>
          <p class="text-center text-muted mt-3">DISSIPL</p>
        </div>
      </div>
    </div>

    <script src="/dissipl-preview/js/pages/change-password-first-login.js"></script>
