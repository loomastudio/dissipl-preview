    <link rel="stylesheet" href="/dissipl-preview/css/stylestest.css?v=20261023" />
    <style>
      .as-page { max-width: 920px; margin: 0 auto; padding: 0 16px 64px; }
      .as-hero { padding: 130px 16px 24px; }
      .as-hero h1 { display: inline-flex; align-items: center; gap: 12px; }
      .as-hero h1 .as-badge { font: 600 .8rem var(--font-body); background: #E6F3EA; color: #2F7A47; border-radius: 999px; padding: 4px 10px; }
      .as-card { background: #fff; border-radius: 20px; box-shadow: 0 10px 30px rgba(31,31,61,.07); padding: 20px; margin-bottom: 18px; }
      .as-notice { border-left: 5px solid var(--color-primary); }
      .as-notice h2 { font: 700 1.05rem var(--font-heading); margin: 0 0 8px; color: var(--color-text-primary); }
      .as-notice ul { margin: 0; padding-left: 20px; color: var(--color-text-secondary); font-size: .95rem; }
      .as-notice li { margin: 4px 0; }
      .as-settings { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: center; }
      .as-settings label, .as-settings .as-lbl { font-weight: 700; color: var(--color-text-primary); margin: 0; font-size: .95rem; }
      .as-profiles { display: flex; flex-wrap: wrap; gap: 6px; }
      .as-profile, .as-chip { border: 1.5px solid #E2D9CF; background: #FFF8F0; color: var(--color-text-primary); border-radius: 999px; padding: 6px 12px; font: 600 .9rem var(--font-body); cursor: pointer; text-align: left; }
      .as-profile[aria-pressed="true"] { background: var(--color-primary); border-color: var(--color-primary); color: #fff; }
      .as-chip:hover, .as-profile:hover { border-color: var(--color-primary); }
      .as-chip:focus-visible, .as-profile:focus-visible, .as-btn:focus-visible, .as-report:focus-visible { outline: 3px solid #2C68BE; outline-offset: 2px; }
      .as-settings select { border: 1.5px solid #E2D9CF; border-radius: 10px; padding: 6px 10px; font: 600 .9rem var(--font-body); background: #fff; }
      .as-chat { min-height: 120px; }
      .as-examples h3 { font: 700 1rem var(--font-heading); margin: 0 0 10px; }
      .as-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
      .as-chips-title { width: 100%; font-weight: 700; font-size: .85rem; color: var(--color-text-light); }
      .as-fb { background: #EEF3FC; border-color: #C9D8F2; }
      .as-msg { margin: 18px 0; scroll-margin-top: 100px; }
      .as-who { font: 700 .8rem var(--font-body); color: var(--color-text-light); margin: 0 6px 4px; text-transform: uppercase; letter-spacing: .04em; }
      .as-user { text-align: right; }
      .as-user .as-bubble { display: inline-block; text-align: left; background: #2C68BE; color: #fff; border-radius: 18px 18px 4px 18px; padding: 10px 16px; max-width: 85%; white-space: pre-wrap; }
      .as-bot .as-bubble { background: #fff; border-radius: 4px 18px 18px 18px; padding: 18px 20px; box-shadow: 0 8px 24px rgba(31,31,61,.08); color: var(--color-text-primary); }
      .as-bubble p { margin: 0 0 10px; line-height: 1.6; }
      .as-bubble ul, .as-bubble ol { margin: 0 0 10px; padding-left: 22px; line-height: 1.55; }
      .as-sec { border-top: 1px solid #F0E8DF; padding-top: 12px; margin-top: 12px; }
      .as-sec:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }
      .as-sec h4 { font: 700 1.05rem var(--font-heading); color: var(--color-primary-dark); margin: 0 0 8px; }
      .as-sec h5 { font: 700 .92rem var(--font-body); margin: 10px 0 6px; color: var(--color-text-primary); }
      .as-dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 0 0 10px; }
      .as-dl dt { font-weight: 700; color: var(--color-text-light); font-size: .9rem; }
      .as-dl dd { margin: 0; font-weight: 600; }
      .as-facts blockquote { margin: 0 0 8px; padding: 8px 12px; background: #F5F5F7; border-radius: 10px; font-style: italic; color: var(--color-text-secondary); white-space: pre-wrap; }
      .as-small { font-size: .85rem; color: var(--color-text-light); }
      .as-warn { color: #9A6A00; }
      .as-tip { background: #FBF2DC; border-radius: 10px; padding: 8px 12px; }
      .as-alert { background: #FBE7E7; border-left: 4px solid var(--color-primary); border-radius: 8px; padding: 10px 12px; }
      .as-tool { border: 2px solid #E6F3EA; background: #F7FBF8; border-radius: 16px; padding: 14px; margin-bottom: 10px; }
      .as-tool-alt { border-color: #E5EDF9; background: #F8FAFE; }
      .as-tool-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; margin-bottom: 8px; }
      .as-tool-head strong { font: 700 1.1rem var(--font-heading); }
      .as-tool-head em { font-style: normal; font-size: .82rem; color: #2F7A47; font-weight: 700; }
      .as-row { display: grid; grid-template-columns: 170px 1fr; gap: 10px; margin-bottom: 6px; }
      .as-row span { font-weight: 700; font-size: .88rem; color: var(--color-text-light); }
      .as-row p { margin: 0; }
      .as-limit { font-size: .88rem; color: var(--color-text-secondary); }
      .as-links { display: flex; flex-wrap: wrap; gap: 8px; }
      .as-btn { display: inline-block; border-radius: 999px; padding: 7px 14px; font: 700 .9rem var(--font-body); text-decoration: none !important; }
      .as-btn.red { background: var(--color-primary); color: #fff !important; }
      .as-btn.line { border: 1.5px solid #D9CFC4; color: var(--color-text-primary) !important; }
      .as-notool { background: #F5F5F7; border-radius: 10px; padding: 10px 12px; font-weight: 600; }
      .as-adapt { background: #FAFAFF; border-radius: 12px; padding: 12px; }
      .as-sources { margin-top: 12px; font-size: .88rem; }
      .as-sources summary { cursor: pointer; font-weight: 700; color: var(--color-text-secondary); }
      .as-sources cite { font-style: italic; }
      .as-field { color: var(--color-text-light); }
      .as-disclaimer { margin-top: 14px !important; padding-top: 10px; border-top: 1px dashed #E2D9CF; font-size: .82rem; color: var(--color-text-light); }
      .as-report { background: none; border: 0; color: var(--color-text-light); font: 600 .82rem var(--font-body); margin-top: 8px; padding: 4px 0; cursor: pointer; text-decoration: underline; }
      .as-form { position: sticky; bottom: 0; background: linear-gradient(to top, #FFF8F0 70%, rgba(255,248,240,0)); padding: 18px 0 14px; z-index: 5; }
      .as-form .as-inputrow { display: flex; gap: 10px; align-items: flex-end; background: #fff; border-radius: 18px; box-shadow: 0 10px 30px rgba(31,31,61,.10); padding: 10px; }
      .as-form textarea { flex: 1; border: 0; resize: none; min-height: 52px; max-height: 180px; font: 1rem var(--font-body); padding: 6px 8px; outline: none; background: transparent; }
      .as-send { background: var(--color-primary); color: #fff; border: 0; border-radius: 14px; padding: 12px 20px; font: 700 1rem var(--font-body); cursor: pointer; }
      .as-new { background: none; border: 0; color: var(--color-text-secondary); font: 700 .9rem var(--font-body); cursor: pointer; margin-top: 8px; }
      #asReport { border: 0; border-radius: 18px; padding: 22px; max-width: 520px; width: calc(100% - 32px); box-shadow: 0 20px 60px rgba(0,0,0,.25); }
      #asReport::backdrop { background: rgba(31,31,61,.45); }
      #asReport h3 { font: 700 1.2rem var(--font-heading); }
      #asReport textarea { width: 100%; min-height: 110px; border: 1.5px solid #E2D9CF; border-radius: 12px; padding: 10px; font: 1rem var(--font-body); }
      #asReport .as-dlg-btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
      #asReport .as-close { background: none; border: 1.5px solid #D9CFC4; border-radius: 999px; padding: 7px 14px; font-weight: 700; }
      #asReport .as-send-report { background: var(--color-primary); color: #fff; border: 0; border-radius: 999px; padding: 8px 16px; font-weight: 700; }
      @media (max-width: 640px) {
        .as-hero { padding-top: 110px; }
        .as-card, .as-bot .as-bubble { padding: 14px; }
        .as-row { grid-template-columns: 1fr; gap: 2px; }
        .as-dl { grid-template-columns: 1fr; }
        .as-user .as-bubble { max-width: 95%; }
        .as-send { padding: 12px 14px; }
      }
    </style>
  <script>window.DISSIPL_PREVIEW = true;</script>
</head>
  <body class="d-flex flex-column min-vh-100">
    <div id="header-placeholder"></div>

    <main translate="no">
      <section class="page-hero as-hero">
        <h1><span id="asTitle">Assistant pédagogique</span></h1>
        <p class="page-subtitle" id="asSubtitle"></p>
      </section>

      <div class="as-page">
        <section class="as-card as-notice" aria-labelledby="asNoticeTitle">
          <h2 id="asNoticeTitle"></h2>
          <ul id="asNotice"></ul>
        </section>

        <section class="as-card as-settings">
          <span class="as-lbl" id="asProfileLabel"></span>
          <div class="as-profiles" id="asProfiles" role="group" aria-labelledby="asProfileLabel"></div>
          <label for="asLevel" id="asLevelLabel"></label>
          <select id="asLevel"></select>
        </section>

        <div class="as-card as-examples" id="asExamplesWrap">
          <h3 id="asExamplesTitle"></h3>
          <div class="as-chips" id="asExamples"></div>
        </div>

        <div class="as-chat" id="asLog" aria-live="polite"></div>

        <form class="as-form" id="asForm" autocomplete="off">
          <div class="as-inputrow">
            <label for="asInput" class="sr-only">Question</label>
            <textarea id="asInput" rows="2" maxlength="1500"></textarea>
            <button type="submit" class="as-send" id="asSend">Envoyer</button>
          </div>
          <button type="button" class="as-new" id="asNew"></button>
        </form>
      </div>

      <dialog id="asReport">
        <h3></h3>
        <p class="as-small"></p>
        <textarea maxlength="1000"></textarea>
        <div class="as-dlg-btns">
          <button type="button" class="as-close">✕</button>
          <button type="button" class="as-send-report"></button>
        </div>
      </dialog>
    </main>

    <div id="footer-placeholder"></div>
