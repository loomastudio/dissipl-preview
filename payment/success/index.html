<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paiement Réussi - DISSIPL</title>
    <link rel="icon" type="image/png" href="/dissipl-preview/assets/Images/disableFallDamage.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/dissipl-preview/css/stylestest.css" />
    <style>
        .success-container {
            max-width: 600px;
            margin: 120px auto 60px;
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }
        .success-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        .success-container h1 {
            color: var(--color-primary);
            margin-bottom: 20px;
        }
        .success-container p {
            color: var(--color-text-secondary);
            font-size: 1.1rem;
            margin-bottom: 30px;
        }
        .btn-home {
            display: inline-block;
            padding: 12px 30px;
            background: var(--color-primary);
            color: white;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .btn-home:hover {
            background: var(--color-primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(211, 47, 47, 0.3);
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">
    <div id="header-placeholder"></div>

    <main class="flex-fill">
        <div class="success-container">
            <div class="success-icon">✅</div>
            <h1>Paiement Réussi !</h1>
            <p>Merci pour votre abonnement. Votre compte est maintenant actif.</p>
            <p style="font-size: 0.95rem;">Votre paiement est en cours de vérification.</p>
            <a href="/dissipl-preview/index.html" class="btn-home">Retour à l'accueil</a>
        </div>
    </main>

    <div id="footer-placeholder"></div>
    <script src="/dissipl-preview/js/core/footer.js"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script type="module" src="/dissipl-preview/js/core/header.js?v=20260916-mobile"></script>
    <script>
        // Don't auto redirect - let the user manually navigate after verifying payment
        // setTimeout(() => {
        //     window.location.href = '/dissipl-preview/profile';
        // }, 5000);

        // Get payment ID from URL query params if available
        const urlParams = new URLSearchParams(window.location.search);
        const plan = urlParams.get('plan');

        // Fetch session status and verify payment with Mollie
        fetch('/api/session/status', {
            credentials: 'include',
            headers: { Accept: 'application/json' }
        })
        .then(res => res.json())
        .then(data => {
            if (data.authenticated && data.user && data.user.premium_active) {
                // Premium is active - show success message
                document.querySelector('.success-container p').textContent =
                    'Merci pour votre abonnement. Votre compte Premium est maintenant actif !';
                return;
            }

            if (data.authenticated && plan) {
                // User is logged in but premium not yet active
                // Trigger payment verification on the server
                fetch('/api/payment/verify-and-activate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ plan })
                })
                .then(res => res.json())
                .then(result => {
                    if (result.activated) {
                        // Premium activated - show success
                        document.querySelector('.success-container p').textContent =
                            'Merci pour votre abonnement. Votre compte Premium est maintenant actif !';
                    } else {
                        // Payment not found or not paid
                        document.querySelector('.success-container p').textContent =
                            'Paiement en cours de vérification...';
                    }
                })
                .catch(err => {
                    console.error('Verification error:', err);
                    document.querySelector('.success-container p').textContent =
                        'Merci pour votre abonnement. Veuillez vous reconnecter.';
                });
            } else if (data.authenticated) {
                // Payment processed but JWT not yet updated
                // Show re-login prompt
                const container = document.querySelector('.success-container');
                container.innerHTML = `
                    <div class="success-icon">✅</div>
                    <h1>Paiement Réussi !</h1>
                    <p>Merci pour votre abonnement. Veuillez vous reconnecter pour activer votre compte Premium.</p>
                    <a href="/dissipl-preview/index.html" class="btn-home">Se reconnecter</a>
                `;
            }
        })
        .catch(err => {
            console.error('Error checking session:', err);
        });
    </script>

<div id="preview-badge" style="position:fixed;left:12px;bottom:12px;z-index:3000;background:#1D2245;color:#fff;font:600 12px/1.3 Lexend,Verdana,sans-serif;padding:8px 12px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:260px;pointer-events:none">
  Version de test · Test version<br><span style="font-weight:400;opacity:.8">Connexion et Premium désactivés ici · Login and Premium disabled here</span>
</div>
</body>
</html>
