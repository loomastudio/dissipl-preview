<!-- seo -->
<meta name="description" content="Assistant pédagogique DISSIPL : décrivez la difficulté d'un élève à besoins éducatifs particuliers et recevez une démarche concrète, une activité de manipulation et l'outil DISSIPL adapté. Sans diagnostic médical, sans donnée personnelle.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://www.dissipl.fr/assistant">
<!-- /seo -->

    <link rel="apple-touch-icon" href="/dissipl-preview/assets/Images/disableFallDamage.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />

</head>
  <body class="d-flex flex-column min-vh-100">
    <div id="header-placeholder"></div>

    <main translate="no">
      <section class="page-hero as-hero">
        <h1><span id="asTitle">Assistant pédagogique</span></h1>
        <p class="page-subtitle" id="asSubtitle"></p>
      </section>

      <div class="as-page">
        <section class="as-card as-notice" aria-labelledby="asNoticeTitle">
          <h2 id="asNoticeTitle"></h2>
          <ul id="asNotice"></ul>
        </section>

        <section class="as-card as-settings">
          <span class="as-lbl" id="asProfileLabel"></span>
          <div class="as-profiles" id="asProfiles" role="group" aria-labelledby="asProfileLabel"></div>
          <label for="asLevel" id="asLevelLabel"></label>
          <select id="asLevel"></select>
        </section>

        <div class="as-card as-examples" id="asExamplesWrap">
          <h3 id="asExamplesTitle"></h3>
          <div class="as-chips" id="asExamples"></div>
        </div>

        <div class="as-chat" id="asLog" aria-live="polite"></div>

        <form class="as-form" id="asForm" autocomplete="off">
          <div class="as-inputrow">
            <label for="asInput" class="sr-only">Question</label>
            <textarea id="asInput" rows="2" maxlength="1500"></textarea>
            <button type="submit" class="as-send" id="asSend">Envoyer</button>
          </div>
          <button type="button" class="as-new" id="asNew"></button>
        </form>
      </div>

      <dialog id="asReport">
        <h3></h3>
        <p class="as-small"></p>
        <textarea maxlength="1000"></textarea>
        <div class="as-dlg-btns">
          <button type="button" class="as-close">✕</button>
          <button type="button" class="as-send-report"></button>
        </div>
      </dialog>
    </main>

    <div id="footer-placeholder"></div>
    <script src="/dissipl-preview/js/core/footer.js"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script type="module" src="/dissipl-preview/js/core/header.js?v=20260916-mobile"></script>
    <script type="module" src="/dissipl-preview/js/pages/assistant.js?v=20261116"></script>
