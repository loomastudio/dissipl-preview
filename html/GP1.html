<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="DISSIPL - Le Boulier, outil de manipulation pour compter et calculer." />
  <title>Boulier prémium - DISSIPL</title>

  <link rel="icon" type="image/png" href="/dissipl-preview/assets/Images/disableFallDamage.png" />
  <link rel="apple-touch-icon" href="/dissipl-preview/assets/Images/disableFallDamage.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />

  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/dissipl-preview/css/stylestest.css" />
  <link rel="stylesheet" href="/dissipl-preview/css/unity-loader.css" />
  <!-- Auth (à conserver absolument) -->
    <script src="/dissipl-preview/js/core/authGuard.js"></script>
    <script>
      // Bloque :
      // - les gens pas connectés
      // - les élèves si requireAdult = true
      // - les non-premium si requirePremium = true
      authGuard({ requireAdult: false, requirePremium: true });
    </script>
<script>window.DISSIPL_PREVIEW = true;</script>
</head>

<body class="d-flex flex-column min-vh-100 game-page-body">
  <div id="header-placeholder"></div>

  <main class="game-wrapper unity-game-main" id="unity-page-main">
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>

      <div class="unity-overlay" id="unity-loading">
        <div class="unity-overlay-text">Merci de patienter...</div>
        <div class="unity-overlay-bar">
          <div class="unity-overlay-full" id="unity-progress-bar-full"></div>
        </div>
        <div class="unity-overlay-label" id="unity-progress-label">0%</div>
      </div>

      <div class="unity-overlay-banner" id="unity-warning"></div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="/dissipl-preview/js/core/footer.js"></script>
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

  <script type="module" src="/dissipl-preview/js/core/header.js?v=20260916-mobile"></script>
  <script src="/dissipl-preview/js/pages/interactEffectsUI.js"></script>

  <script type="module">
    import { initUnityGame } from "/dissipl-preview/js/games/unityGameLoader.js";

    initUnityGame({
      // DOM
      headerPlaceholderId: "header-placeholder",
      footerPlaceholderId: "footer-placeholder",
      mainId: "unity-page-main",
      containerId: "unity-container",
      canvasId: "unity-canvas",
      loadingId: "unity-loading",
      progressBarId: "unity-progress-bar-full",
      progressLabelId: "unity-progress-label",
      warningId: "unity-warning",

      // Sizing
      aspect: 16 / 9,
      padding: 24,
      minHeight: 560,
      minWidth: 980,
      maxWidth: 1500,

      // Espace visuel garanti sous le header fixed
      pushContentBelowHeader: true,
      headerGapPx: 12,

      // Page de jeu: ne pas réserver la place du footer
      reserveFooterSpace: false,

      // Unity build (premium)
      buildRoot: "/dissipl-preview/webgl/premium/Build",
      buildName: "premium",
      streamingAssetsUrl: "StreamingAssets",

      // Unity metadata
      companyName: "Sylvain Héliou",
      productName: "Boulier",
      productVersion: "1.3"
    });
  </script>

<div id="preview-badge" style="position:fixed;left:12px;bottom:12px;z-index:3000;background:#1D2245;color:#fff;font:600 12px/1.3 Lexend,Verdana,sans-serif;padding:8px 12px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:260px;pointer-events:none">

</div>
</body>
</html>
